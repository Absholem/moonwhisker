<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Moonwhisker</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #15172c; color: #fff3d6;
    font-family: monospace; touch-action: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #hud {
    position: fixed; inset: 15px 18px auto;
    display: flex; justify-content: space-between; gap: 12px;
    pointer-events: none; font-weight: bold;
    font-size: clamp(12px, 2vw, 18px);
    text-shadow: 2px 2px #15172c;
  }
  #stats { line-height: 1.6; }
  #pause {
    pointer-events: auto; align-self: flex-start;
    font-size: 16px; padding: 8px 12px;
  }
  button {
    font: bold 17px monospace; color: #fff3d6;
    background: #53416b; border: 3px solid #ac83ad;
    box-shadow: 0 4px 0 #262039; padding: 12px 22px;
    cursor: pointer;
  }
  button:hover { background: #705182; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #262039; }
  button:focus-visible { outline: 3px solid #ffd989; outline-offset: 4px; }
  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #111326a8; padding: 22px;
  }
  .panel {
    width: min(510px, 100%); padding: 30px 24px;
    background: #24243beF; border: 4px solid #aa7eab;
    box-shadow: 8px 8px 0 #10132590; text-align: center;
  }
  .eyebrow { color: #95d8cf; letter-spacing: 3px; font-size: 12px; }
  h1 {
    margin: 14px 0; color: #ffd28a;
    font-size: clamp(27px, 6vw, 44px);
    text-shadow: 4px 4px #765174;
  }
  #description { line-height: 1.8; font-size: 15px; }
  .hint { font-size: 12px; color: #b7b6cc; line-height: 1.8; }
  #touch {
    position: fixed; bottom: 20px; left: 18px; right: 18px;
    display: none; justify-content: space-between;
    pointer-events: none; user-select: none;
  }
  #touch > div { display: flex; gap: 12px; }
  #touch button {
    pointer-events: auto; width: 64px; height: 60px;
    padding: 0; opacity: .78; font-size: 24px; touch-action: none;
  }
  #touch #jump { width: 88px; font-size: 16px; }
  @media (pointer: coarse) {
    #touch { display: flex; }
    #hud { inset: 10px 12px auto; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Moonwhisker pixel-art cat platformer"></canvas>

<div id="hud">
  <div id="stats"></div>
  <button id="pause" aria-label="Pause game">Ⅱ</button>
</div>

<div id="overlay">
  <div class="panel">
    <div class="eyebrow">AN ENDLESS PIXEL ADVENTURE</div>
    <h1 id="title">MOONWHISKER</h1>
    <p id="description"></p>
    <button id="start">LET'S PROWL</button>
    <p class="hint">
      A / D or ← / → · Move<br>
      Space / W / ↑ · Jump twice!<br>
      P · Pause
    </p>
  </div>
</div>

<div id="touch">
  <div>
    <button id="left" aria-label="Move left">◀</button>
    <button id="right" aria-label="Move right">▶</button>
  </div>
  <button id="jump" aria-label="Jump">JUMP</button>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const TILE = 24;
  let W, H = 360;

  function resize() {
    W = Math.max(180, Math.round(H * innerWidth / innerHeight));
    canvas.width = W;
    canvas.height = H;
    ctx.imageSmoothingEnabled = false;
  }
  addEventListener('resize', resize);
  resize();

  const palette = {
    o: '#513748', f: '#f7b475', l: '#ffe1a0',
    d: '#d58166', w: '#fff5d7', e: '#292c43',
    p: '#f389a0', b: '#86e0dd', s: '#469ba9',
    v: '#9387ba', a: '#c4afd7'
  };

  const catSprite = [
    '..oo......oo....',
    '..ofo....ofo....',
    '..offooooffo....',
    '..offffffffo....',
    '.offlfffflffo...',
    '.offeffffeffo...',
    '.offffppffffo...',
    '..ofllllllfo....',
    '...offffffo.....',
    '...offffffo..oo.',
    '..offffffffo.of o'.replace(' ', ''),
    '..offffffffoofo.',
    '..offfffffffoo..',
    '...oflooflo.....',
    '...olloollo.....',
    '................'
  ];

  const fishSprite = [
    '....bb....',
    '..bbwb..b.',
    '.bbebb.bb.',
    '..bbbbbbb.',
    '....bb..b.',
    '..........'
  ];

  const bunnySprite = [
    '..vv....vv..',
    '..vav..vav..',
    '...vvvvvv...',
    '..vaaaaavv..',
    '.vaaaaaaavv.',
    '.vaeeaeeavv.',
    '.vaaaaaaavv.',
    '..vvvvvvvv..',
    '...vv..vv...',
    '............'
  ];

  function sprite(data, x, y, scale = 2, flip = false) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (flip) {
      ctx.translate(data[0].length * scale, 0);
      ctx.scale(-1, 1);
    }
    for (let row = 0; row < data.length; row++) {
      for (let col = 0; col < data[row].length; col++) {
        const color = palette[data[row][col]];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(col * scale, row * scale, scale, scale);
      }
    }
    ctx.restore();
  }

  let best = 0;
  try { best = Number(localStorage.getItem('moonwhisker-best')) || 0; }
  catch (_) {}

  let mode = 'title', seed = 1, rng = 1;
  let columns, pickups, enemies, particles;
  let generated, elevation, gapLeft, safeRun, gapCooldown;
  let player, camera, clock, fishCount, distance, score;

  const keys = new Set();
  const touch = { left: false, right: false };
  let jumpBuffer = 0;

  // --- AUDIO SYNTHESIS START ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function sfx(freq1, freq2, type, duration) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // Volume
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }

  function playJump() { sfx(300, 100, 'square', 0.2); }
  function playFish() { sfx(800, 1200, 'square', 0.1); }

  let bgmTimer;
  const melody = [220, 277, 330, 440, 330, 277]; // Simple arpeggio
  let note = 0;
  function startBGM() {
    if (bgmTimer) return;
    bgmTimer = setInterval(() => {
      sfx(melody[note], melody[note], 'triangle', 0.2);
      note = (note + 1) % melody.length;
    }, 200); // Speed of music
  }
  function stopBGM() {
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
  // --- AUDIO SYNTHESIS END ---

  function random() {
    rng ^= rng << 13;
    rng ^= rng >>> 17;
    rng ^= rng << 5;
    return (rng >>> 0) / 4294967296;
  }

  function hash(n) {
    let x = Math.imul(n ^ seed, 374761393);
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }

  function generateTo(target) {
    while (generated <= target) {
      const i = generated++;
      let top = elevation;

      if (i > 16 && gapLeft === 0 &&
          safeRun > 7 && gapCooldown <= 0 && random() < .085) {
        gapLeft = random() < .5 ? 1 : 2;
        gapCooldown = 10;
      }

      if (gapLeft > 0) {
        top = null;
        gapLeft--;
        safeRun = 0;
      } else {
        if (i > 12 && safeRun > 2 && random() < .22) {
          elevation = Math.max(10, Math.min(13,
            elevation + (random() < .5 ? -1 : 1)));
        }
        top = elevation;
        safeRun++;
        gapCooldown--;
      }

      columns.push(top);

      if (i > 7 && top !== null && random() < .27) {
        pickups.push({
          x: i * TILE + 3,
          y: top * TILE - 42 - (random() < .2 ? 32 : 0),
          phase: random() * 6.28,
          taken: false
        });
      }

      if (i > 22 && top !== null && safeRun > 4 && random() < .075) {
        enemies.push({
          x: i * TILE + 1,
          y: top * TILE - 18,
          w: 22, h: 18,
          phase: random() * 6.28,
          dead: false
        });
      }
    }
  }

  function reset() {
    seed = (Date.now() ^ (Math.random() * 0x7fffffff)) | 0;
    rng = seed || 1;
    columns = [];
    pickups = [];
    enemies = [];
    particles = [];
    generated = 0;
    elevation = 12;
    gapLeft = 0;
    safeRun = 0;
    gapCooldown = 10;
    camera = 0;
    clock = 0;
    fishCount = 0;
    distance = 0;
    score = 0;
    jumpBuffer = 0;
    keys.clear();
    touch.left = touch.right = false;
    player = {
      x: 72, y: 200, w: 20, h: 26,
      vx: 0, vy: 0, grounded: false, jumps: 0,
      coyote: 0, face: 1, hearts: 3, invincible: 0,
      safeX: 72, safeY: 12 * TILE - 26
    };
    generateTo(Math.ceil(W / TILE) + 30);
    updateHUD();
  }

  function updateHUD() {
    $('stats').innerHTML =
      `<span style="color:#ff9faa">${'♥ '.repeat(player.hearts)}${'♡ '.repeat(3-player.hearts)}</span>` +
      `<br>FISH ${fishCount} · ${Math.floor(distance)}m` +
      `<br>SCORE ${score} · BEST ${best}`;
  }

  function overlay(title, text, button) {
    $('title').textContent = title;
    $('description').innerHTML = text;
    $('start').textContent = button;
    $('overlay').style.display = 'flex';
  }

  function start() {
    if (mode !== 'paused') reset();
    mode = 'play';
    $('overlay').style.display = 'none';
    startBGM();
  }

  function pause() {
    if (mode === 'play') {
      mode = 'paused';
      stopBGM();
      keys.clear();
      touch.left = touch.right = false;
      jumpBuffer = 0;
      overlay('CAT NAP', 'Your adventure is waiting.', 'KEEP PROWLING');
    } else if (mode === 'paused') start();
  }

  function finish() {
    mode = 'over';
    stopBGM();
    best = Math.max(best, score);
    try { localStorage.setItem('moonwhisker-best', String(best)); }
    catch (_) {}
    updateHUD();
    overlay('NICE PROWL!',
      `You explored <b>${Math.floor(distance)}m</b> and found ` +
      `<b>${fishCount} fish</b>.<br>Score: <b>${score}</b> · Best: <b>${best}</b>` +
      `<br>A fresh world awaits your next adventure.`,
      'NEW ADVENTURE');
  }

  function burst(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - .5) * 135,
        vy: -30 - Math.random() * 125,
        life: .35 + Math.random() * .4,
        color
      });
    }
  }

  function hurt(fall = false) {
    if (!fall && player.invincible > 0) return;
    player.hearts--;
    burst(player.x + 10, player.y + 12, '#f389a0', 18);
    if (player.hearts <= 0) {
      finish();
      return;
    }
    player.invincible = 1.8;
    if (fall) {
      player.x = player.safeX;
      player.y = player.safeY - 4;
      player.vx = 0;
      player.vy = 0;
      player.jumps = 0;
      camera = Math.max(0, player.x - W * .35);
    } else {
      player.vy = -230;
      player.grounded = false;
    }
    updateHUD();
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Each generated column is solid below its grassy top.
  function terrainCollision(axis) {
    const first = Math.floor(player.x / TILE);
    const last = Math.floor((player.x + player.w - .001) / TILE);
    for (let i = first; i <= last; i++) {
      const top = columns[i];
      if (top === null || top === undefined) continue;
      const ground = {
        x: i * TILE, y: top * TILE,
        w: TILE, h: 2000
      };
      if (!overlaps(player, ground)) continue;

      if (axis === 'x') {
        if (player.vx > 0) player.x = ground.x - player.w;
        if (player.vx < 0) player.x = ground.x + TILE;
        player.vx = 0;
      } else if (player.vy >= 0) {
        player.y = ground.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.jumps = 0;
        player.coyote = .1;
      }
    }
  }

  function update(dt) {
    clock += dt;
    jumpBuffer = Math.max(0, jumpBuffer - dt);
    player.invincible = Math.max(0, player.invincible - dt);
    player.coyote = Math.max(0, player.coyote - dt);

    const left = keys.has('ArrowLeft') || keys.has('KeyA') || touch.left;
    const right = keys.has('ArrowRight') || keys.has('KeyD') || touch.right;
    const direction = Number(right) - Number(left);
    const targetSpeed = direction * 150;
    const acceleration = player.grounded ? 1400 : 850;
    const change = Math.max(-acceleration * dt,
      Math.min(acceleration * dt, targetSpeed - player.vx));
    player.vx += change;
    if (direction) player.face = direction;

    if (jumpBuffer > 0 && (player.coyote > 0 || player.jumps < 2)) {
      const firstJump = player.grounded || player.coyote > 0;
      player.jumps = firstJump ? 1 : 2;
      player.vy = firstJump ? -330 : -305;
      playJump();
      player.grounded = false;
      player.coyote = 0;
      jumpBuffer = 0;
      burst(player.x + 10, player.y + 26,
        firstJump ? '#dfbad0' : '#95e4df', 7);
    }

    player.x += player.vx * dt;
    terrainCollision('x');
    player.x = Math.max(0, player.x);

    player.vy = Math.min(650, player.vy + 900 * dt);
    const oldBottom = player.y + player.h;
    player.y += player.vy * dt;
    player.grounded = false;
    terrainCollision('y');

    if (player.grounded) {
      const col = Math.floor((player.x + player.w / 2) / TILE);
      // Respawn only on a broad, safe patch of ground.
      if (columns[col - 1] === columns[col] &&
          columns[col + 1] === columns[col]) {
        player.safeX = col * TILE + 2;
        player.safeY = columns[col] * TILE - player.h;
      }
      if (Math.abs(player.vx) > 50 && Math.random() < dt * 12) {
        burst(player.x + 10, player.y + 26, '#b299ae', 1);
      }
    } else if (player.coyote <= 0 && player.jumps === 0) {
      // Walking off an edge retains one midair jump.
      player.jumps = 1;
    }

    generateTo(Math.ceil((player.x + W + 500) / TILE));

    for (const f of pickups) {
      if (f.taken || Math.abs(f.x - player.x) > 70) continue;
      const fy = f.y + Math.sin(clock * 3 + f.phase) * 4;
      if (overlaps(player, { x: f.x, y: fy, w: 20, h: 12 })) {
        f.taken = true;
        fishCount++;
        playFish();
        burst(f.x + 10, fy + 5, '#86e0dd', 12);
        // Every 12 fish restores one heart.
        if (fishCount % 12 === 0 && player.hearts < 3) {
          player.hearts++;
          burst(player.x + 10, player.y, '#f389a0', 18);
        }
      }
    }

    for (const e of enemies) {
      if (e.dead || Math.abs(e.x - player.x) > 75) continue;
      if (!overlaps(player, e)) continue;
      if (player.vy > 0 && oldBottom <= e.y + 7) {
        e.dead = true;
        player.vy = -255;
        player.jumps = 1;
        playJump();
        burst(e.x + 11, e.y + 8, '#c4afd7', 16);
      } else {
        hurt();
        if (mode !== 'play') return;
      }
    }

    if (player.y > 540) {
      hurt(true);
      if (mode !== 'play') return;
    }

    distance = Math.max(distance, (player.x - 72) / 12);
    score = Math.floor(distance) + fishCount * 25;
    camera += (Math.max(0, player.x - W * .35) - camera) *
      Math.min(1, dt * 7);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    updateHUD();
  }

  function background() {
    ctx.fillStyle = '#20243e';
    ctx.fillRect(0, 0, W, H);

    // Slowly moving stars, generated from stable world coordinates.
    const starOffset = camera * .12;
    const start = Math.floor(starOffset / 65) - 1;
    for (let i = start; i < start + W / 65 + 3; i++) {
      const x = i * 65 + hash(i + 900) * 50 - starOffset;
      const y = 20 + hash(i + 1700) * 160;
      ctx.fillStyle = Math.sin(clock * 1.5 + i) > .4
        ? '#ffe7b4' : '#8c90b5';
      ctx.fillRect(Math.floor(x), Math.floor(y), 2, 2);
      if (hash(i + 45) > .8) {
        ctx.fillRect(Math.floor(x) - 1, Math.floor(y) + 1, 4, 1);
      }
    }

    const mx = Math.floor(W * .78);
    ctx.fillStyle = '#f9dcaa';
    ctx.fillRect(mx, 38, 27, 27);
    ctx.fillRect(mx - 4, 43, 35, 17);
    ctx.fillStyle = '#20243e';
    ctx.fillRect(mx - 3, 35, 20, 22);
    ctx.fillRect(mx + 1, 53, 13, 6);

    // Layered skyline silhouettes.
    for (let layer = 0; layer < 2; layer++) {
      const speed = layer === 0 ? .2 : .4;
      const width = layer === 0 ? 72 : 48;
      const offset = camera * speed;
      const first = Math.floor(offset / width) - 1;
      for (let i = first; i < first + W / width + 3; i++) {
        const x = Math.floor(i * width - offset);
        const height = 30 + Math.floor(hash(i + layer * 456) * 80);
        const y = (layer === 0 ? 245 : 285) - height;
        ctx.fillStyle = layer === 0 ? '#2e3150' : '#3c3a58';
        ctx.fillRect(x, y, width - 3, H - y);
        ctx.fillRect(x + 7, y - 7, width - 17, 7);
        if (layer === 1) {
          ctx.fillStyle = '#807080';
          for (let wy = y + 14; wy < 275; wy += 22) {
            if (hash(i * 20 + wy) > .45)
              ctx.fillRect(x + 12, wy, 5, 7);
          }
        }
      }
    }
  }

  function render() {
    background();
    const cam = Math.floor(camera);
    const first = Math.max(0, Math.floor(cam / TILE));
    const last = Math.min(columns.length - 1, Math.ceil((cam + W) / TILE));

    for (let i = first; i <= last; i++) {
      const top = columns[i];
      if (top === null) continue;
      const x = i * TILE - cam;
      const y = top * TILE;

      ctx.fillStyle = '#604858';
      ctx.fillRect(x, y, TILE, H - y);
      ctx.fillStyle = '#79556a';
      ctx.fillRect(x, y + 8, TILE, 10);
      ctx.fillStyle = '#9fc4aa';
      ctx.fillRect(x, y, TILE, 4);
      ctx.fillStyle = '#659889';
      ctx.fillRect(x, y + 4, TILE, 4);

      for (let row = top + 1; row < 16; row++) {
        ctx.fillStyle = hash(i * 31 + row) > .5 ? '#896477' : '#4c3d50';
        ctx.fillRect(x + 3 + Math.floor(hash(i + row * 87) * 15),
          row * TILE + 6, 5, 3);
      }

      if (hash(i + 800) > .67) {
        ctx.fillStyle = '#9fc4aa';
        ctx.fillRect(x + 6, y - 4, 2, 5);
        ctx.fillRect(x + 10, y - 6, 2, 7);
      }
      if (i > 5 && hash(i + 1900) > .91) {
        ctx.fillStyle = '#659889';
        ctx.fillRect(x + 17, y - 9, 2, 9);
        ctx.fillStyle = '#f2b1be';
        ctx.fillRect(x + 14, y - 12, 8, 4);
        ctx.fillStyle = '#ffe1a0';
        ctx.fillRect(x + 17, y - 11, 2, 2);
      }
    }

    // A little starting sign.
    if (cam < 180) {
      ctx.fillStyle = '#ac7b79';
      ctx.fillRect(36 - cam, 253, 3, 35);
      ctx.fillStyle = '#e2b48c';
      ctx.fillRect(22 - cam, 248, 37, 17);
      ctx.fillStyle = '#604858';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('→', 34 - cam, 261);
    }

    for (const f of pickups) {
      if (f.taken || f.x < cam - 25 || f.x > cam + W) continue;
      const y = f.y + Math.sin(clock * 3 + f.phase) * 4;
      sprite(fishSprite, f.x - cam, y);
    }

    for (const e of enemies) {
      if (e.dead || e.x < cam - 25 || e.x > cam + W) continue;
      const bob = Math.round(Math.sin(clock * 6 + e.phase));
      sprite(bunnySprite, e.x - cam - 1, e.y - 2 + bob);
    }

    if (player.invincible <= 0 || Math.floor(clock * 14) % 2 === 0) {
      const run = player.grounded && Math.abs(player.vx) > 20;
      const bob = run ? Math.floor(Math.sin(clock * 22) * 1.5) : 0;
      sprite(catSprite, player.x - cam - 6, player.y - 4 + bob,
        2, player.face < 0);
      if (run) {
        ctx.fillStyle = '#ffe1a0';
        const stride = Math.sin(clock * 22) > 0 ? 2 : -2;
        ctx.fillRect(Math.round(player.x - cam + 2 + stride),
          Math.round(player.y + 24), 6, 2);
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - cam), Math.round(p.y), 3, 3);
    }
    ctx.globalAlpha = 1;

    // Subtle pixel vignette at the bottom.
    ctx.fillStyle = '#15172c55';
    ctx.fillRect(0, H - 8, W, 8);
  }

  $('start').addEventListener('click', start);$('pause').addEventListener('click', pause);

  const movementKeys = [
    'ArrowLeft', 'ArrowRight', 'ArrowUp',
    'KeyA', 'KeyD', 'KeyW', 'Space'
  ];

  addEventListener('keydown', e => {
    if (movementKeys.includes(e.code)) e.preventDefault();

    if (e.code === 'KeyP' || e.code === 'Escape') {
      if (!e.repeat) pause();
      return;
    }
    if (e.code === 'Enter' && mode !== 'play') {
      e.preventDefault();
      if (!e.repeat) start();
      return;
    }
    if (mode !== 'play') return;

    keys.add(e.code);
    if (!e.repeat && ['Space', 'ArrowUp', 'KeyW'].includes(e.code))
      jumpBuffer = .13;
  });

  addEventListener('keyup', e => keys.delete(e.code));

  function bindTouch(id, action) {
    const element = $(id);
    element.addEventListener('pointerdown', e => {
      e.preventDefault();
      element.setPointerCapture(e.pointerId);
      if (mode !== 'play') return;
      if (action === 'jump') jumpBuffer = .13;
      else touch[action] = true;
    });
    const release = () => {
      if (action !== 'jump') touch[action] = false;
    };
    element.addEventListener('pointerup', release);
    element.addEventListener('pointercancel', release);
    element.addEventListener('lostpointercapture', release);
  }

  bindTouch('left', 'left');
  bindTouch('right', 'right');
  bindTouch('jump', 'jump');

  addEventListener('blur', () => {
    keys.clear();
    touch.left = touch.right = false;
    if (mode === 'play') pause();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && mode === 'play') pause();
  });

  reset();
  overlay('MOONWHISKER',
    'A curious cat. A moonlit city. An endless trail of fish.<br>' +
    'Explore freshly generated terrain, double-jump over gaps, ' +
    'and bounce on dust bunnies.<br>' +
    '<span style="color:#95d8cf">Every 12 fish restores a heart.</span>',
    "LET'S PROWL");

  let previous = performance.now();
  function frame(now) {
    const dt = Math.min(.04, (now - previous) / 1000);
    previous = now;

    if (mode === 'play') {
      const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
      for (let i = 0; i < steps && mode === 'play'; i++)
        update(dt / steps);
    } else if (mode === 'title') {
      clock += dt;
    }

    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
